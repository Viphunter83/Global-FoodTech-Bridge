version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gfb_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gfb_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gfb_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gfb_net

  redis:
    image: redis:7-alpine
    container_name: gfb_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gfb_net

  passport-service:
    build:
      context: ./apps/backend/passport-service
      dockerfile: Dockerfile
    container_name: gfb_passport_service
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/gfb_db?sslmode=disable
      - PORT=8080
      - INTERNAL_API_KEY=default_secret_api_key_123
      - FIREBASE_PROJECT_ID=global-foodtech-bridge-prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gfb_net

  iot-service:
    build:
      context: ./apps/backend/iot-service
      dockerfile: Dockerfile
    container_name: gfb_iot_service
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/gfb_db?sslmode=disable
      - PORT=8081
      - REDIS_URL=redis://redis:6379
      - INTERNAL_API_KEY=default_secret_api_key_123
      - FIREBASE_PROJECT_ID=global-foodtech-bridge-prod
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gfb_net

  blockchain-service:
    build:
      context: ./apps/backend/blockchain-service
      dockerfile: Dockerfile
    container_name: gfb_blockchain_service
    environment:
      - PORT=3000
      - RPC_URL=https://rpc-amoy.polygon.technology
      - PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY}
      - LOGISTICS_KEY=${BLOCKCHAIN_LOGISTICS_KEY}
      - RETAILER_KEY=${BLOCKCHAIN_RETAILER_KEY}
      - CONTRACT_ADDRESS=0xE326362613F44383504b1bFA5Dd92C0Fc7D38471
      - INTERNAL_API_KEY=default_secret_api_key_123
      - FIREBASE_PROJECT_ID=global-foodtech-bridge-prod
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gfb_net

  frontend-portal:
    build:
      context: ./apps/frontend/portal
      dockerfile: Dockerfile
    container_name: gfb_frontend
    environment:
      - PORT=3001
      - NEXT_TELEMETRY_DISABLED=1
      - INTERNAL_API_KEY=default_secret_api_key_123
      - NEXT_PUBLIC_PASSPORT_SERVICE_URL=http://passport-service:8080/api/v1
      - NEXT_PUBLIC_IOT_SERVICE_URL=http://iot-service:8081/api/v1
      - NEXT_PUBLIC_BLOCKCHAIN_SERVICE_URL=http://blockchain-service:3000/api/v1
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=global-foodtech-bridge-prod
    ports:
      - "3005:3001"
    links:
      - passport-service
      - iot-service
      - blockchain-service
    networks:
      - gfb_net

networks:
  gfb_net:
    driver: bridge

volumes:
  postgres_data:
