# ╔══════════════════════════════════════════════════════════════════╗
# ║  Global FoodTech Bridge — CI Pipeline                          ║
# ║  Builds & validates all services on every push / PR            ║
# ╚══════════════════════════════════════════════════════════════════╝

name: CI — Build & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.22'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Frontend Portal (Next.js)
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: 🖥️ Frontend Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend/portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/frontend/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Provide stub values for build-time env vars
          NEXT_PUBLIC_APP_URL: https://gftb.app
          NEXT_PUBLIC_FIREBASE_API_KEY: stub
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: stub
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: stub

      - name: Check bundle size
        run: |
          echo "📊 Bundle Size Report:"
          echo "========================"
          du -sh .next/ 2>/dev/null || echo "No .next directory"
          echo ""
          echo "Static pages:"
          find .next/server -name "*.html" 2>/dev/null | wc -l | xargs echo "  HTML files:"
          echo ""
          echo "✅ Frontend build successful"

  # ──────────────────────────────────────────────────────────────────
  # 2. Blockchain Service (NestJS / TypeScript)
  # ──────────────────────────────────────────────────────────────────
  blockchain-service:
    name: ⛓️ Blockchain Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/blockchain-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/blockchain-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────
  # 3. Passport Service (Go)
  # ──────────────────────────────────────────────────────────────────
  passport-service:
    name: 🛂 Passport Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/passport-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/passport-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

  # ──────────────────────────────────────────────────────────────────
  # 4. IoT Telemetry Service (Go)
  # ──────────────────────────────────────────────────────────────────
  iot-service:
    name: 🌡️ IoT Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/iot-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/iot-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

  # ──────────────────────────────────────────────────────────────────
  # 5. CI Status Gate (required check for branch protection)
  # ──────────────────────────────────────────────────────────────────
  ci-pass:
    name: ✅ CI Pass
    runs-on: ubuntu-latest
    needs: [frontend, blockchain-service, passport-service, iot-service]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Frontend:    ${{ needs.frontend.result }}"
          echo "Blockchain:  ${{ needs.blockchain-service.result }}"
          echo "Passport:    ${{ needs.passport-service.result }}"
          echo "IoT:         ${{ needs.iot-service.result }}"

          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.blockchain-service.result }}" != "success" ] || \
             [ "${{ needs.passport-service.result }}" != "success" ] || \
             [ "${{ needs.iot-service.result }}" != "success" ]; then
            echo "❌ One or more jobs failed!"
            exit 1
          fi

          echo "✅ All CI checks passed!"
